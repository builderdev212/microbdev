name: cocotb
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Repository
        uses: actions/checkout@v7
      - name: Pull Container
        run: docker pull ghcr.io/builderdev212/cocotb-runner:latest
      - name: Run Tests
        run: |
          docker run --rm \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          ghcr.io/builderdev212/cocotb-runner:latest \
          bash -lc "cd verif/cocotb && pytest --junitxml=test-results.xml"
      - name: Generate Coverage Report
        run: |
          docker run --rm \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          ghcr.io/builderdev212/cocotb-runner:latest \
          bash -lc "cd verif/cocotb/ && bash scripts/coverage.sh"
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: junit
          path: verif/cocotb/test-results.xml
      - name: Upload Test Coverage
        uses: codecov/codecov-action@v7
        with:
          files: verif/cocotb/coverage.xml
